<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Q&A AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #ffffff;
            --accent-pink: #ffb6c1; /* Light pink for main elements */
            --accent-pink-hover: #ffc0cb;
            --dark-pink: #d81159;
            --text-color: #2b2b2b;
            --border-color: #ffb3c6;
        }
        
        body {
            font-family: 'Inter', sans-serif; 
            background-color: #fff0f5; /* base light pink */
            color: var(--text-color);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        /* Golden sparkles lighting on and off */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-color: rgba(255, 248, 220, 0.5); /* warm golden tint */
            background-image: 
                radial-gradient(3px 3px at 20px 30px, #ffd700, transparent),
                radial-gradient(4px 4px at 70px 90px, #ffdf00, transparent),
                radial-gradient(2px 2px at 110px 40px, #ffffff, transparent),
                radial-gradient(3px 3px at 160px 130px, #ffd700, transparent),
                radial-gradient(4px 4px at 220px 20px, #ffea00, transparent),
                radial-gradient(2px 2px at 260px 100px, #ffffff, transparent);
            background-size: 300px 300px;
            animation: lightPulse 4s ease-in-out infinite;
        }
        
        @keyframes lightPulse {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; filter: brightness(1.2); }
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%; max-width: 800px;
            padding: 50px; border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(255, 112, 150, 0.15);
        }
        h1 { 
            color: var(--dark-pink); font-weight: 600; font-size: 2.2rem;
            text-align: center; margin-top: 0; margin-bottom: 30px;
        }
        h2 { 
            color: var(--dark-pink); font-weight: 500; font-size: 1.4rem; margin-bottom: 15px; 
        }
        
        input[type="file"] {
            width: 100%; padding: 12px; margin-bottom: 20px;
            border: 2px dashed var(--border-color); border-radius: 12px;
            background: white; cursor: pointer; transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            display: flex; align-items: center;
        }
        
        /* Light green choose file button */
        input[type="file"]::file-selector-button {
            background-color: #e0f8e0;
            border: 1px solid #b3e6b3;
            color: #2b2b2b;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-right: 15px;
        }
        
        input[type="file"]::file-selector-button:hover {
            background-color: #ccf2cc;
            transform: scale(1.02);
            box-shadow: 0 4px 10px rgba(0, 255, 0, 0.1);
        }

        input[type="file"]:hover {
            border-color: var(--accent-pink);
            background-color: #fff9fa;
        }
        
        input[type="text"] {
            width: 100%; padding: 16px; margin-bottom: 20px;
            border: 2px solid #ffe4e1; border-radius: 12px;
            font-family: 'Inter', sans-serif; font-size: 1rem;
            transition: all 0.3s ease; outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--accent-pink);
            box-shadow: 0 0 0 4px rgba(255, 182, 193, 0.3);
        }
        button {
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-pink-hover));
            color: #d81159; border: none; width: 100%;
            padding: 16px 25px; border-radius: 12px; cursor: pointer;
            font-weight: 600; font-size: 1.05rem; font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 182, 193, 0.6);
            background: linear-gradient(45deg, var(--accent-pink-hover), var(--accent-pink));
        }
        button:active {
            transform: translateY(1px);
        }
        
        /* SHINING AND BRIGHT UPLOAD BUTTON EFFECT - Light Pink */
        #uploadForm button {
            background: linear-gradient(90deg, #ffb6c1, #ffc0cb, #ffb6c1, #ffc0cb);
            background-size: 300% auto;
            animation: shine 3s linear infinite;
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.7);
            border: 1px solid rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.15rem;
            padding: 18px 25px;
            color: #d81159;
        }
        
        @keyframes shine {
            to {
                background-position: 300% center;
            }
        }
        
        .response-area {
            min-height: 120px; padding: 24px;
            background-color: #ffffff; border: 1px solid var(--border-color);
            border-radius: 16px; margin-top: 25px; white-space: pre-wrap;
            font-size: 1.05rem; line-height: 1.6;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Document Q&A Portal</h1>
    
    <h2>1. Upload Knowledge Base</h2>
    <form id="uploadForm">
        <input type="file" id="fileInput" required>
        <button type="submit">Upload Document</button>
        <div id="uploadStatus"></div>
    </form>
    <h2 style="margin-top: 30px;">2. Ask Questions</h2>
    <form id="askForm">
        <input type="text" id="questionInput" placeholder="Ask a question..." required>
        <button type="submit">Submit Question</button>
        <div id="askStatus"></div>
    </form>
    <div class="response-area" id="responseArea">Answers appear here...</div>
</div>
<script>
    // Uncomment this for local testing:
    // const API_BASE_URL = 'http://localhost:8000';
    
    // Replace this with your actual Render URL once the backend is deployed:
    const API_BASE_URL = 'https://cloudrag-backend.onrender.com';
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('file', document.getElementById('fileInput').files[0]);
        document.getElementById('uploadStatus').textContent = 'Uploading...';
        document.getElementById('uploadStatus').style.color = 'inherit';
        
        try {
            const response = await fetch(`${API_BASE_URL}/upload`, { method: 'POST', body: formData });
            const data = await response.json();
            if (!response.ok) {
                document.getElementById('uploadStatus').textContent = 'Error: ' + (data.detail || 'Upload failed');
                document.getElementById('uploadStatus').style.color = 'red';
                return;
            }
            document.getElementById('uploadStatus').textContent = 'Uploaded! Indexed ' + data.chunks_indexed + ' chunks.';
            document.getElementById('uploadStatus').style.color = 'green';
        } catch (error) {
            document.getElementById('uploadStatus').textContent = 'Error connecting to server.';
            document.getElementById('uploadStatus').style.color = 'red';
            console.error(error);
        }
    });
    
    document.getElementById('askForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const question = document.getElementById('questionInput').value;
        document.getElementById('askStatus').textContent = 'Thinking...';
        document.getElementById('askStatus').style.color = 'inherit';
        
        try {
            const response = await fetch(`${API_BASE_URL}/ask`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question }) 
            });
            const data = await response.json();
            
            if (!response.ok) {
                document.getElementById('responseArea').textContent = "Backend Error:\n" + (data.detail || JSON.stringify(data));
                document.getElementById('askStatus').textContent = 'Failed!';
                document.getElementById('askStatus').style.color = 'red';
                return;
            }
            
            document.getElementById('responseArea').textContent = data.answer || data.response || "No answer returned.";
            document.getElementById('askStatus').textContent = 'Success!';
            document.getElementById('askStatus').style.color = 'green';
        } catch (error) {
            document.getElementById('responseArea').textContent = "Failed to connect to the backend server. Is it running?";
            document.getElementById('askStatus').textContent = 'Error!';
            document.getElementById('askStatus').style.color = 'red';
            console.error(error);
        }
    });
</script>
</body>
</html>
